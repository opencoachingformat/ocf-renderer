name: CI

on: [push, pull_request]

# Least-privilege: CI only checks out, builds, and tests — read is enough.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run generate:types
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npm run build:browser
