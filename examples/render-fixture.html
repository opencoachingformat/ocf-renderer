<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OCF Renderer — fixture preview</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #ffffff;
      }
      canvas {
        display: block;
        width: 800px;
        height: 600px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "../node_modules/three/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="stage" width="800" height="600"></canvas>
    <script type="module">
      import { OCFRenderer } from "../dist/index.js";

      async function main() {
        const params = new URLSearchParams(window.location.search);
        const fixture = params.get("fixture");
        if (!fixture) {
          throw new Error("render-fixture.html: missing required ?fixture= query param");
        }
        const requestedFrameIndex = Number(params.get("frame") ?? "0");

        const response = await fetch(`../src/__fixtures__/${fixture}.json`);
        if (!response.ok) {
          throw new Error(`render-fixture.html: failed to fetch fixture "${fixture}" (${response.status})`);
        }
        const doc = await response.json();
        const rawFrameIndex = Number.isFinite(requestedFrameIndex) ? requestedFrameIndex : 0;
        const frameIndex = Math.max(0, Math.min(rawFrameIndex, doc.frames.length - 1));

        const canvas = document.getElementById("stage");
        const renderer = new OCFRenderer(doc);
        renderer.renderToCanvas(frameIndex, canvas);
        canvas.dataset.rendered = "true";

        if (doc.frames.length > 1) {
          const nav = document.createElement("div");
          nav.id = "frame-nav";
          nav.style.cssText = "position:fixed;top:8px;left:8px;font-family:system-ui,sans-serif;font-size:14px;";

          const makeLink = (label, targetFrame) => {
            const el = document.createElement("a");
            el.textContent = label;
            el.href = `?fixture=${encodeURIComponent(fixture)}&frame=${targetFrame}`;
            return el;
          };
          const makeDisabled = (label) => {
            const el = document.createElement("span");
            el.textContent = label;
            el.style.color = "#aaa";
            return el;
          };

          nav.appendChild(frameIndex > 0 ? makeLink("\u2190 prev", frameIndex - 1) : makeDisabled("\u2190 prev"));
          nav.appendChild(document.createTextNode(`\u00a0\u00a0frame ${frameIndex + 1} / ${doc.frames.length}\u00a0\u00a0`));
          nav.appendChild(
            frameIndex < doc.frames.length - 1
              ? makeLink("next \u2192", frameIndex + 1)
              : makeDisabled("next \u2192"),
          );
          document.body.appendChild(nav);
        }
      }

      main().catch((error) => {
        document.body.textContent = `Error: ${error.message}`;
        console.error(error);
      });
    </script>
  </body>
</html>
